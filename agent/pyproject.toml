[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-agent"
version = "1.0.0"
description = "A Strands AI agent"
requires-python = ">=3.14.9,<3.15"
dependencies = [
    "strands-agents[otel]~=1.62",
    "strands-agents-tools~=0.8.10",
    "bedrock-agentcore~=1.25",
    "aws-opentelemetry-distro~=0.21.0",
    "boto3~=1.43.118"
]

[dependency-groups]
dev = [
    "pytest~=9.1",
    "ruff~=0.17.2",
    "mypy~=2.4",
]

[tool.uv]
required-version = "~=0.13.5"
# Strands permits MCP 1.x; its 2.x ceiling excludes the session-exhaustion fix.
constraint-dependencies = ["mcp>=1.30,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
