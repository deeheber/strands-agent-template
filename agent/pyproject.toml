[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-agent"
version = "1.0.0"
description = "A Strands AI agent"
requires-python = ">=3.14"
dependencies = [
    "strands-agents[otel]~=1.57",
    "strands-agents-tools~=0.8.9",
    "bedrock-agentcore~=1.24",
    "aws-opentelemetry-distro~=0.21.0",
    "boto3~=1.43"
]

[dependency-groups]
dev = [
    "pytest~=9.1",
    "ruff~=0.16.10",
    "mypy~=2.4",
    "black~=26.5",
]

[tool.uv]
required-version = "~=0.12.0"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
